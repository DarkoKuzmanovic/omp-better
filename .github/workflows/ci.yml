name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      # The suites use a fake `omp` (tests/fake-omp.ts), so CI needs no omp install and no login.
      - run: bun test
